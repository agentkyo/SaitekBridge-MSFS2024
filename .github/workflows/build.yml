name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build SaitekBridge.slnx -c Release

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish src/SaitekBridge/SaitekBridge.csproj -c Release -r win-x64 --self-contained `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o publish
          Copy-Item packaging/*.bat, README*.md, LICENSE publish/
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'dev' }
          Compress-Archive publish/* "SaitekBridge-$version-win-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: SaitekBridge-win-x64
          path: SaitekBridge-*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SaitekBridge-*.zip
          generate_release_notes: true
